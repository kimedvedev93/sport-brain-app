name: SportBrain
options:
  bundleIdPrefix: com.kimedvedev93
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SportBrain:
    type: application
    platform: iOS
    sources:
      - SportBrain
    info:
      path: SportBrain/Info.plist
      properties:
        CFBundleDisplayName: Спорт
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kimedvedev93.sportbrain
        TARGETED_DEVICE_FAMILY: "1"
